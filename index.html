<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Dokter</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <header class="app-header text-white">
      <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h1 class="h3 fw-bold mb-0">Dashboard <span class="fw-normal">Dokter</span></h1>
      </div>
    </header>

    <main class="container pb-4 main-pull">
      <div class="row g-3">
        <!-- Form resep -->
        <div class="col-lg-5">
          <section class="card shadow-sm rounded-4">
            <div class="card-body">
              <h2 class="h6 fw-bold mb-3">Input resep baru</h2>

              <label for="dokter" class="form-label small text-secondary">Nama dokter</label>
              <input id="dokter" class="form-control" placeholder="Masukkan Nama Dokter" />

              <label for="pasien" class="form-label small text-secondary mt-3"
                >Nama / No. RM pasien</label
              >
              <input id="pasien" class="form-control" placeholder="Masukkan Nama Pasien / Ruangan" />

              <label class="form-label small text-secondary mt-3">Obat (maks. 4 tabung)</label>
              <div id="items"></div>
              <button type="button" id="add" class="btn btn-light text-primary fw-semibold btn-sm">
                + Tambah obat
              </button>

              <button type="button" id="send" class="btn btn-brand w-100 mt-3 py-2 fw-semibold">
                Kirim resep ke mesin
              </button>
              <div id="msg" class="d-none" role="status"></div>
            </div>
          </section>
        </div>

        <div class="col-lg-7 d-flex flex-column gap-3">
          <section class="card shadow-sm rounded-4">
            <div class="card-body">
              <h2 class="h6 fw-bold mb-3">Stok virtual</h2>
              <div id="stock" class="row g-2"></div>
            </div>
          </section>

          <section class="card shadow-sm rounded-4">
            <div class="card-body">
              <h2 class="h6 fw-bold mb-3">Status resep</h2>
              <div id="rx" class="table-responsive"></div>
            </div>
          </section>

          <section class="card shadow-sm rounded-4">
            <div class="card-body">
              <h2 class="h6 fw-bold mb-3">Log eksekusi mesin</h2>
              <ul id="logs" class="list-group list-group-flush small overflow-auto log-box"></ul>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
